name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: 语法与可运行
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 版本信息
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) {
                Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
              $failed++
            } else {
              Write-Host "ok  $($f.Name)"
            }
          }
          if ($failed -gt 0) { throw "$failed 个脚本无法解析" }

      - name: 实跑 diag1~diag5（干净环境也得跑得完）
        shell: pwsh
        run: |
          # 脚本自己设了 SilentlyContinue，缺某块硬件也只是少一行输出，
          # 不应该整个崩掉。这里验证的就是这一点。
          # 注意：-Filter 不支持 [] 通配，必须用 Where-Object 过滤，
          # 否则一个文件都匹配不到、循环空转，测试会假绿。
          $failed = 0
          $scripts = Get-ChildItem -Filter 'diag*.ps1' | Where-Object { $_.Name -match '^diag[1-5]_' }
          if ($scripts.Count -lt 5) { throw "只找到 $($scripts.Count) 个脚本，预期 5 个" }
          foreach ($f in $scripts) {
            $out = & $f.FullName 2>&1 | Out-String
            if ($out.Trim().Length -lt 40) {
              Write-Host "::error file=$($f.Name)::$($f.Name) 没有产生有效输出"
              $failed++
            } else {
              Write-Host "ok  $($f.Name)  输出 $($out.Length) 字符"
            }
          }
          if ($failed -gt 0) { throw "$failed 个脚本运行失败" }

      - name: 注入假数据验证算得对（tests/）
        shell: pwsh
        run: |
          # 上面那步只证明"能跑出字"，这步证明"算出来的数是对的"。
          # 用同名函数遮蔽真实 cmdlet 喂假硬件数据，不需要 Pester。
          ./tests/test-diag1.ps1
          if ($LASTEXITCODE -ne 0) { throw "tests/test-diag1.ps1 失败" }

      - name: run_all 能跑完并落盘报告
        shell: pwsh
        run: |
          & .\run_all.ps1 | Out-String | Write-Host
          $report = Get-ChildItem -Filter '体检报告-*.txt' | Select-Object -First 1
          if (-not $report) { throw "run_all 没有生成报告文件" }
          Write-Host "报告已生成: $($report.Name)，$($report.Length) 字节"
          if ($report.Length -lt 500) { throw "报告内容过短，可能没跑到各诊断项" }

      - name: 报告必须是 UTF-8 且内容完整
        shell: pwsh
        run: |
          $report = Get-ChildItem -Filter '体检报告-*.txt' | Select-Object -First 1

          # Tee-Object 在 PowerShell 5.1 下写出的是 UTF-16LE：
          # git diff 会当成二进制，不少编辑器打开是乱码，留档对比没法用。
          $bytes = [System.IO.File]::ReadAllBytes($report.FullName)
          if ($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) {
            throw "报告是 UTF-16LE，期望 UTF-8"
          }
          Write-Host "编码检查通过（非 UTF-16）"

          $lines = [System.IO.File]::ReadAllLines($report.FullName, [System.Text.UTF8Encoding]::new($false))
          Write-Host "总行数: $($lines.Count)"

          # 自己实现 tee 时踩过的坑：Format-Table 输出的是格式对象，
          # 直接转字符串会变成类型名，报告里只剩一堆 FormatStartData。
          $bad = $lines | Where-Object { $_ -match 'Format(Start|Entry|End)Data|Microsoft\.PowerShell\.Commands' }
          if ($bad) {
            throw "报告里有 $($bad.Count) 处未渲染的格式对象，说明 tee 没先 Out-String -Stream"
          }
          Write-Host "无格式对象残留 ✓"

          # 五节标记都得在
          foreach ($tag in 'diag1_hardware','diag2_startup','diag3_security','diag4_system','diag5_gpu_errors') {
            if (-not ($lines | Where-Object { $_ -match $tag })) {
              throw "报告里缺 $tag 这一节"
            }
          }
          Write-Host "五节齐全 ✓"

  readonly:
    name: 只读承诺
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 诊断脚本不得包含修改系统状态的命令
        run: |
          # 这个脚本集的卖点就是「只读」：不改系统、不删文件。
          # 一旦有人加了个 Remove-Item，承诺就破了，所以用 CI 守住。
          if grep -nE 'Remove-Item|Set-ItemProperty|New-ItemProperty|Remove-ItemProperty|Stop-Service|Stop-Process|Set-Service|Start-Process|Invoke-Expression|sc\.exe|reg (add|delete)' *.ps1; then
            echo "::error::脚本集承诺全程只读，检出会改系统状态的命令"
            exit 1
          fi
          echo "只读承诺成立：没有删除、改注册表、停服务、起进程的命令 ✓"

      - name: run_all 引用的脚本都存在
        run: |
          missing=0
          for f in $(grep -oE 'diag[0-9][a-z0-9_]*\.ps1' run_all.ps1 | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::error::run_all.ps1 引用了不存在的 $f"
              missing=1
            else
              echo "ok  $f"
            fi
          done
          exit $missing
